# 模型服务配置示例
# 复制为 config.yaml；该文件不应提交到仓库。
# provider 可选 ollama / api，缺省按旧版本的 api 模式处理。
llm:
  provider: ollama
  base_url: http://localhost:11434/v1
  model: qwen2.5:7b
  temperature: 0.1
  max_tokens: 2048
  timeout: 60.0       # SDK 单次请求超时（秒），不是整批任务期限
  max_retries: 1     # SDK 对符合条件的网络/服务错误最多重试一次

# API 模式示例（替换上面的 llm 段；密钥优先取环境变量 ATC_API_KEY）
# llm:
#   provider: api
#   base_url: https://api.deepseek.com/v1
#   model: deepseek-chat
#   temperature: 0.1
#   max_tokens: 2048
#   timeout: 60.0
#   max_retries: 1
#   # api_key: your-api-key-here  # 不建议把真实密钥写入文件
